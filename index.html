<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- PWA Settings -->
  <title>MONETA Antibiotic Tracker</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0ea5e9" />

  <!-- iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MONETA" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3004/3004458.png" />

  <!-- PWA Crash Handler (Debug) -->
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      // Create error overlay on screen
      const errorDiv = document.createElement('div');
      errorDiv.style.position = 'fixed';
      errorDiv.style.top = '0';
      errorDiv.style.left = '0';
      errorDiv.style.width = '100%';
      errorDiv.style.height = '100%';
      errorDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.9)';
      errorDiv.style.color = 'white';
      errorDiv.style.padding = '20px';
      errorDiv.style.zIndex = '99999';
      errorDiv.style.overflow = 'auto';
      errorDiv.style.fontFamily = 'monospace';
      errorDiv.style.whiteSpace = 'pre-wrap';
      errorDiv.innerHTML = '<h1>Application Error</h1>' +
        '<p><strong>Message:</strong> ' + message + '</p>' +
        '<p><strong>Source:</strong> ' + source + ':' + lineno + ':' + colno + '</p>' +
        '<p><strong>Error:</strong> ' + (error && error.stack ? error.stack : error) + '</p>' +
        '<button onclick="location.reload()" style="background:white; color:red; padding:10px; border:none; border-radius:5px; margin-top:20px;">Reload App</button>';
      document.body.appendChild(errorDiv);
      return false;
    };

    window.addEventListener('unhandledrejection', function (event) {
      window.onerror('Unhandled Promise Rejection: ' + event.reason, '', 0, 0, event.reason);
    });
  </script>
</head>

<body class="bg-slate-50 text-slate-900 antialiased pb-safe">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
